name: AppSec CI/CD Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-gate:
    name: SAST & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Gate 1: Software Composition Analysis (SCA) - Blocks outdated Flask==2.0.1
      - name: Run pip-audit (Dependency Vulnerability Scan)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      # Gate 2: Static Application Security Testing (SAST) - Blocks Reflected XSS in app.py
      - name: Run Semgrep CLI (SAST Code Scan)
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/flask --error